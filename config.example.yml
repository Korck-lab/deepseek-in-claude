# deepseek-in-claude proxy config
# Loaded from ./config.yml by default; override with --config PATH.
# CLI args win over this file. Keys are optional — omitting falls back to defaults.

# Listen port (default 8016).
port: 8016

# Listen address (default 127.0.0.1). The proxy holds your DeepSeek key and
# substitutes your Anthropic OAuth token, so it binds loopback only. Widen this
# solely if you understand that any host able to reach it inherits both.
host: 127.0.0.1

# Redirect Anthropic family models to DeepSeek counterparts.
# `--redir` enables it; this block overrides the built-in map:
#   haiku/sonnet/opus -> deepseek-v4-flash, fable -> deepseek-v4-pro
redir:
  haiku: deepseek-v4-flash
  sonnet: deepseek-v4-flash
  opus: deepseek-v4-flash
  fable: deepseek-v4-pro

# Bidirectional fallback: if the routed upstream fails (error/timeout/404/429/5xx),
# retry the other way using the same redir relation — DeepSeek <-> Anthropic.
#
# Off by default, and worth understanding before turning on. A 429 from the
# Anthropic leg is routine on a plan session, and a crossing sends that turn to
# DeepSeek — metered credits — while the response still reports the Anthropic
# model you asked for, so nothing on screen says it happened. One proxy serves
# every project, so this setting applies to all of them at once. Crossings are
# tagged `fallbackFrom` in logs/proxy-usage.jsonl. See docs/adr/0005.
fallback: false

# Idle-socket timeout for every upstream leg, in milliseconds (default 60000).
# Streaming responses reset it on each chunk, so it bounds silence rather than
# total duration — a long answer will not trip it, a dead connection will.
upstreamTimeoutMs: 60000

# Log every request/response shape to /tmp/deepseek-proxy-payloads.jsonl.
# Equivalent to `--debug` on the CLI. Content and auth headers never logged.
debug: false

# OPT-IN effort override. DeepSeek V4 accepts all five Claude Code effort
# levels natively (low|medium|high|xhigh|max), so nothing is bridged by
# default. Keep this block only to override specific levels for other model
# families. Unsupported keys fall back to the defaults shown.
effort:
  medium: high  # other-family "medium" -> DeepSeek "high"
  xhigh: max    # other-family "xhigh"  -> DeepSeek "max"

# Route image-bearing requests away from vision-less models.
# DeepSeek V4 has no vision, so an image block in a request 400s upstream. Turned
# on, a turn carrying an image goes to a local vision model instead — LM Studio
# by default, which speaks OpenAI protocol, so this leg translates
# Anthropic <-> OpenAI. No Anthropic plan traffic: an image turn costs only local
# inference.
#
# Off by default, because the redirect only works if you are running that server,
# and turning it on sends your prompt and image to it — a host the proxy would
# otherwise never contact — and answers you out of a model you did not pick in
# `/model`. One proxy serves every project, so this applies to all of them at
# once. Left off, an image turn fails upstream and the proxy says why.
#
# baseUrl is the OpenAI-compatible server; model is the vision-capable id it
# reports on /v1/models. Redirected turns are tagged `redirected` in
# logs/proxy-usage.jsonl. See docs/adr/0004.
vision:
  redirect: false
  baseUrl: http://127.0.0.1:1234
  model: prism-ml/bonsai-27b

# Per-model capability overrides, for providers that don't report them.
# Wins over both the per-family default and any value fetched from /v1/models.
# A model reported as vision-capable here is never rerouted even if it is
# DeepSeek-class.
capabilities:
  deepseek-v4-flash:
    vision: false

# Anthropic credential bridge. Claude Code only runs gateway model discovery
# when ANTHROPIC_AUTH_TOKEN is set, and that value would otherwise override your
# claude.ai login on every request. The proxy swaps this exact sentinel for your
# real Claude Code OAuth token on the Anthropic leg, and drops any x-api-key the
# client sent, because api.anthropic.com prefers that header over the bearer. Set
# false (or pass --no-auth-bridge) to disable — Anthropic models then answer 401 in
# sentinel mode, AND a client-supplied x-api-key is forwarded again, so a stray
# ANTHROPIC_API_KEY in your shell silently bills your Anthropic traffic to API
# credits. That passthrough exists for diagnosing with your own real Anthropic
# credential; do not flip this key for unrelated reasons.
#
# scripts/install.sh writes a random per-install sentinel into config.yml, and
# claudei.sh reads it back from there — config.yml is the single source of truth,
# because a launcher and proxy that disagree 401 every Anthropic request. Set it
# by hand only if you also set ANTHROPIC_AUTH_TOKEN to the same value yourself.
authBridge: true
sentinel: local-deepseek-proxy

# Let the proxy renew an expired OAuth token and write the rotated value back to
# your credential store. Off by default: writing to the store the real CLI reads
# is the one operation here that could cost you a `/login`. Left off, an expired
# token warns and 401s, and any normal `claude` session refreshes it for you.
oauthRefresh: false
